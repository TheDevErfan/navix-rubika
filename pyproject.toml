[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navix-rubika"
version = "1.0.4"
description = "The most powerful Asynchronous framework for Rubika with 800+ enterprise utilities"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "TheDevErfan" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[dependencies]
requests = ">=2.0.0"
aiohttp = ">=3.8.0"
